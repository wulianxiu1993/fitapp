<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<title>薄肌打卡</title>
<style>
:root{--bg:#111418;--card:#1b2027;--card2:#232a33;--line:#2c3440;--txt:#e8edf2;--sub:#8b98a8;--acc:#7ee081;--acc2:#5cc9e8;--warn:#f2b96b;--bad:#ef8080}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC",system-ui,sans-serif;font-size:16px}
#view{padding:16px 16px 96px;padding-top:max(16px,env(safe-area-inset-top))}
h1{font-size:22px;margin:6px 0 2px}
h2{font-size:17px;margin:18px 0 8px}
.sub{color:var(--sub);font-size:13px;line-height:1.5}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 0}
.card.warn{border:1px solid var(--warn);background:#25211a}
.card.sug{border:1px solid var(--acc2);background:#14222a}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--card2);color:var(--txt);padding:14px;font-size:16px;text-align:left;margin:8px 0}
.btn:active{opacity:.7}
.btn .r{float:right;color:var(--sub);font-size:13px;margin-top:2px}
.btn.main{background:var(--acc);color:#0c130d;font-weight:600;text-align:center}
.btn.blue{background:var(--acc2);color:#08222b;font-weight:600;text-align:center}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#171b21;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:50}
.tabbar button{flex:1;background:none;border:0;color:var(--sub);font-size:12px;padding:8px 0 10px}
.tabbar button.on{color:var(--acc)}
.tabbar .ico{font-size:20px;display:block}
.setbtn{display:inline-block;border:1.5px solid var(--line);background:none;color:var(--txt);border-radius:10px;padding:10px 0;width:31%;margin:4px 1%;font-size:15px;text-align:center}
.setbtn.done{background:var(--acc);color:#0c130d;border-color:var(--acc);font-weight:700}
.setbtn:active{opacity:.6}
.row{display:flex;align-items:center;gap:8px}
.vbtn{display:inline-block;border:1px solid var(--acc2);color:var(--acc2);border-radius:8px;padding:6px 12px;font-size:13px;text-decoration:none}
.chip{display:inline-block;background:var(--card2);border-radius:8px;padding:4px 8px;font-size:12px;color:var(--sub);margin:2px 4px 2px 0}
.chip.on{background:var(--acc);color:#0c130d;font-weight:600}
.chip.tap{border:1px solid var(--line)}
.done-ex{outline:1.5px solid var(--acc)}
#timerBar{position:fixed;left:0;right:0;bottom:56px;background:#0f2e18;border-top:2px solid var(--acc);padding:10px 16px;display:none;z-index:60}
#timerBar .t{font-size:30px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums}
#timerBar .skip{float:right;background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 14px;font-size:14px}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:8px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card2)}
.heat i.l{background:#3f6b45}.heat i.f{background:var(--acc)}
.big{font-size:26px;font-weight:800;margin:0}
.stat{flex:1;background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stat .sub{font-size:12px}
textarea,input[type=text],input[type=number]{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;min-height:44px;font-size:16px;padding:8px;margin:4px 0}
textarea{min-height:90px;font-size:12px}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--acc);color:#0c130d;font-weight:700;border-radius:12px;padding:12px 20px;z-index:99;display:none;max-width:86%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:90;display:none;align-items:center;justify-content:center}
.modal .box{background:var(--card);border-radius:16px;padding:20px;width:86%;max-width:340px;text-align:center}
.modal .mb{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:16px;margin:8px 0;font-weight:600}
details summary{cursor:pointer;color:var(--sub);font-size:14px;padding:6px 0}
label.ck{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px}
input[type=checkbox]{width:18px;height:18px}
a{color:var(--acc2)}
.step{display:inline-flex;align-items:center;background:var(--card2);border-radius:8px;margin:3px 6px 3px 0;font-size:13px}
.step button{background:none;border:0;color:var(--acc2);font-size:16px;padding:6px 10px;font-weight:700}
.step span{padding:0 4px;color:var(--txt)}
.ladder{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ladder .chip{margin:0}
</style>
</head>
<body>
<div id="view"></div>
<div id="timerBar">
  <span class="t" id="tleft">0:00</span>
  <span class="sub" id="tname">组间休息</span>
  <button class="skip" data-act="skipTimer">跳过</button>
</div>
<nav class="tabbar">
  <button data-act="tab" data-v="home" class="on"><span class="ico">🏠</span>今日</button>
  <button data-act="tab" data-v="stats"><span class="ico">📊</span>统计</button>
  <button data-act="tab" data-v="set"><span class="ico">⚙️</span>数据</button>
</nav>
<div class="toast" id="toast"></div>
<div class="modal" id="stepModal">
  <div class="box">
    <div style="font-size:18px;font-weight:700">🚶 今天的步数</div>
    <div class="sub" style="margin:6px 0 10px">目标 8000 步/天。数字在手机自带“健康”App 里看，填进来即可。</div>
    <input type="number" inputmode="numeric" id="stepInput" placeholder="如 8500">
    <button class="mb" style="background:var(--acc);color:#0c130d;font-weight:600" data-act="saveSteps">保存</button>
    <button class="mb" style="background:var(--card2);color:var(--sub)" data-act="clearSteps">清除今日记录</button>
    <button class="mb" style="background:var(--card2);color:var(--sub)" data-act="closeStepModal">关闭</button>
  </div>
</div>
<div class="modal" id="rpeModal">
  <div class="box">
    <div style="font-size:18px;font-weight:700;margin-bottom:4px" id="rpeTitle">这次训练感觉如何？</div>
    <div class="sub" style="margin-bottom:10px">这决定你的动作要不要升级</div>
    <button class="mb" style="background:var(--bad);color:#20100f" data-act="rpe" data-v="hard">😮‍💨 太难了，好几次做不到标准</button>
    <button class="mb" style="background:var(--acc);color:#0c130d" data-act="rpe" data-v="ok">🙂 刚好，最后2次有点勉强</button>
    <button class="mb" style="background:var(--acc2);color:#08222b" data-act="rpe" data-v="easy">😄 太轻松了，远没到力竭</button>
    <div class="sub" style="margin-top:8px;cursor:pointer;text-decoration:underline" data-act="rpeLater">稍后再说</div>
  </div>
</div>

<script>
/* ============ 动作数据（与主计划文档 v3 一致） ============ */
const EX={
 A1:{n:'上斜俯卧撑',sets:3,reps:8,rest:90,load:'自重',tempo:'下放3秒→停1秒→推起2秒',acid:'该酸：胸外上侧（脖子酸=耸肩）',v:'https://www.bilibili.com/video/BV1cH4y1V7sy'},
 A2:{n:'哑铃肩推',sets:3,reps:8,rest:90,load:'双手各持一片4.5kg',tempo:'推起2秒→最高点停1秒→下放3秒',acid:'该酸：肩膀外上方（腰酸=塌腰）',v:'https://www.bilibili.com/video/BV1Z841187pJ'},
 A3:{n:'高脚杯深蹲',sets:3,reps:10,rest:90,load:'双手共捧两片9kg',tempo:'蹲下3秒→底部停1秒→站起2秒',acid:'该酸：大腿前侧+臀（蹲不深→坐椅子做）',v:'https://www.bilibili.com/video/BV1kZBbBSEQL'},
 A4:{n:'弹力带坐姿划船',sets:3,reps:12,rest:75,load:'弹力带（门锚挂低位）',tempo:'拉回2秒→最紧处停2秒→还原3秒',acid:'该酸：肩胛骨中间（脖子酸=耸肩）',v:'https://www.bilibili.com/video/BV1y14y1X7by'},
 A5:{n:'侧平举',sets:2,reps:12,rest:60,load:'前4周空手→之后每手4.5kg',tempo:'抬2秒→停1秒→放3秒',acid:'该酸：肩膀外上侧（抬到与肩同高）',v:'https://www.bilibili.com/video/BV1n8411j7uE'},
 A6:{n:'死虫式（每侧次数）',sets:3,reps:8,rest:45,load:'徒手',tempo:'全程慢：放下3秒→收回2秒',acid:'该紧：腹部深处（腰贴死地面）',v:'https://www.bilibili.com/video/BV12kEQ6gE4c'},
 B1:{n:'弹力带高位下拉',sets:3,reps:12,rest:90,load:'弹力带（门锚挂高位）',tempo:'下拉2秒→底部停1–2秒→还原3秒',acid:'该酸：腋窝后下到腰侧（身体别后仰）',v:'https://www.bilibili.com/video/BV1ZW4y1p7UK'},
 B2:{n:'弹力带扩胸',sets:3,reps:15,rest:60,load:'弹力带',tempo:'拉开2秒→停1秒→回放3秒',acid:'该酸：肩胛骨之间（头别前伸）',v:'https://www.bilibili.com/video/BV1qa411L76a'},
 B3:{n:'后箭步蹲',sets:3,reps:8,rest:90,load:'前2周徒手→之后每手一片4.5kg',tempo:'后退下蹲2秒→底部停1秒→站起2秒',acid:'该酸：前腿臀+大腿（晃就扶椅背）',v:'https://www.bilibili.com/video/BV1iV89zME8a'},
 B4:{n:'罗马尼亚硬拉',sets:3,reps:10,rest:90,load:'双手各持一片4.5kg',tempo:'俯身3秒→拉起2秒',acid:'该酸：臀+大腿后侧（推屁股向后）',v:'https://www.bilibili.com/video/BV1q3411v7cB'},
 B5:{n:'负重臀桥',sets:3,reps:15,rest:75,load:'两片叠放髋上（垫衣服）',tempo:'顶起2秒→夹臀停2秒→下放3秒',acid:'该酸：屁股（腰酸=顶太高）',v:'https://www.bilibili.com/video/BV1yoVmzdEGB'},
 B6:{n:'平板支撑',sets:3,reps:0,rest:45,load:'自重 20–45秒',tempo:'卷尾骨拉平腰背，挤屁股',acid:'该抖：整个腹部（腰一塌立刻停）',v:'https://www.bilibili.com/video/BV1Q34y1j79r'},
 B7:{n:'哑铃弯举（可选）',sets:2,reps:10,rest:60,load:'双手各持4.5kg',tempo:'弯起2秒→挤1秒→放3秒',acid:'该酸：大臂前侧',v:'https://www.bilibili.com/video/BV1bRDgYCEgm'},
};
const WO={A:['A1','A2','A3','A4','A5','A6'],B:['B1','B2','B3','B4','B5','B6']};
const WARMUP=[
 ['W1 开合跳','1分钟','https://www.bilibili.com/video/BV1kJ411u7jW'],
 ['W2 肩绕环','前后各10圈',''],
 ['W3 猫牛式','8次','https://www.bilibili.com/video/BV1nA411i766'],
 ['W4 弹力带扩胸','15次',''],
 ['W5 今日第一个动作·空手版','8次',''],
];
const POST=[
 {id:'S1',n:'90/90呼吸（双脚踩墙）',d:'2组×5次深呼吸｜呼气像吹蜡烛吹到底→肋骨下沉、腰贴地',v:'https://www.bilibili.com/video/BV1DMHAzcE8p'},
 {id:'S2',n:'压胸小肌+门框拉伸',d:'压胸每侧45秒（掌根压锁骨外下方+肩外旋8次）→门框每侧30–45秒×3组',v:'https://www.bilibili.com/video/BV1T2JEzYELk'},
 {id:'S3',n:'天使·当前第1级地板天使',d:'3组×10次｜每周记一次手背离地几指宽（第5周试半程靠墙）',v:'https://www.bilibili.com/video/BV1TvmoYAEgb'},
 {id:'S4',n:'弹力带肩外旋（自对抗版）',d:'2组×每侧15次｜工作侧肘夹死肋骨，另一只手当“立柱”。哑铃替代：侧卧位，肘贴肋骨握最小配片或矿泉水瓶，前臂向上外旋',v:'https://www.bilibili.com/video/BV1xSQHY6ETT',v2:'https://www.bilibili.com/video/BV1Ug411U7E8'},
 {id:'S5',n:'收下巴',d:'3组×10次（每次保持5秒）｜水平后移做“双下巴”，不是低头',v:'https://www.bilibili.com/video/BV1fh411Q7cY'},
 {id:'S6',n:'跪姿髋屈肌拉伸',d:'2组×每侧30秒｜先夹臀收尾骨，再重心前移',v:'https://www.bilibili.com/video/BV19nHszhE4H'},
 {id:'S7',n:'靠墙站姿校准',d:'1分钟｜臀/上背/后脑三点贴墙，腰间一掌',v:''},
 {id:'S8',n:'YTW 俯卧肩胛训练（可选加做）',opt:1,d:'Y/T/W 各10次=1轮，共2轮｜俯卧、额头垫毛巾：Y=下斜方肌 T=中斜方肌 W=菱形肌+后束',v:'https://www.bilibili.com/video/BV1c18b6cEVY'},
];
/* 升级体系：次数上限（连续2次全部做满+不觉得难 → 建议升级）与升级文案（对应主文档第八节） */
const UPPER={A1:12,A2:12,A3:15,A4:20,A5:20,A6:10,B1:20,B2:20,B3:12,B4:15,B5:20,B6:0,B7:15};
const UPGTXT={
 A2:'单手持两片9kg单臂推（另一手扶墙，两片用弹力带捆一圈防滑）',
 A3:'先“底部停3秒”，再进阶“1.5次深蹲”（蹲起半程→再蹲到底算1次）',
 A4:'握带在手上多绕一圈缩短带长，或离门更远',
 A5:'维持4.5kg，节奏改为 抬2秒-停2秒-放4秒',
 A6:'每手握一瓶矿泉水做',
 B1:'握带多绕一圈缩短带长 + 离门更远',
 B2:'握距变窄（带子更短=阻力更大）',
 B3:'每组底部停2秒；第9周起可试“静态分腿蹲”（前后脚固定不撤步）',
 B4:'底部停2秒 → 进阶“1.5次”（俯身半程→回顶→再俯身到底算1次）',
 B5:'升级单腿臀桥（两片撤掉，另一腿伸直抬起）',
 B6:'能轻松撑满45秒后改“轮流抬脚跟”动态平板',
 B7:'单手持两片9kg（弹力带捆一圈），另一手扶墙',
};
const LADDER=['手撑桌面','沙发扶手/矮凳','跪姿俯卧撑','离心俯卧撑（5秒下放+跪姿推起）','标准俯卧撑'];

/* ============ 状态与存储（手机本地 localStorage） ============ */
const KEY='fitApp_v2';
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.logs) S={};
S.logs=S.logs||[];S.posture=S.posture||[];S.sessions=S.sessions||[];
S.walk=S.walk||[];S.steps=S.steps||{};S.ladder=S.ladder||{};S.upgDismiss=S.upgDismiss||{};S.metrics=S.metrics||[];S.warm=S.warm||{};
/* 旧编号自动迁移：S0/S4/S2/S3/S1/S5/S6 → S1–S7（只跑一次） */
if(!S.pm&&S.posture.length){const SMAP={S0:'S1',S4:'S2',S2:'S3',S3:'S4',S1:'S5',S5:'S6',S6:'S7'};S.posture=S.posture.map(k=>{const p=k.split('|');return p[0]+'|'+(SMAP[p[1]]||p[1]);});S.pm=1;save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('保存失败：本地存储不可用，请在“数据”页导出备份')}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysBetween(d1,d2){return Math.round((new Date(d2+'T00:00:00')-new Date(d1+'T00:00:00'))/86400000)}

/* ============ 路由与渲染 ============ */
let tab='home', session=null, openEx=null;
let rpeFor=null; /* 待反馈的完成类型 */
function render(){
 S.logs=S.logs||[];S.posture=S.posture||[];S.sessions=S.sessions||[];S.walk=S.walk||[];S.steps=S.steps||{};S.ladder=S.ladder||{};S.upgDismiss=S.upgDismiss||{};S.metrics=S.metrics||[];S.warm=S.warm||{};
 const v=document.getElementById('view');
 if(tab==='home') v.innerHTML=session?viewSession():viewHome();
 else if(tab==='stats') v.innerHTML=viewStats();
 else v.innerHTML=viewSet();
 window.scrollTo(0,0);
}
function viewHome(){
 const t=today();
 const ri=restInfo();
 const sug=ri.rest?'':ri.sug;
 const doneSetsN=S.logs.filter(l=>l.d===t).length;
 const pd=S.posture.filter(x=>x.startsWith(t)).length;
 const walked=S.walk.includes(t);
 const steps=S.steps[t];
 function stepsLabel(){
  if(steps===undefined)return '🚶 吃与走达标（点我填步数）';
  if(steps>=8000)return '🚶 今日 '+steps+' 步 ✓ 达标';
  return '🚶 今日 '+steps+' 步（还差 '+(8000-steps)+' 步）';
 }
 let h=`<h1>今天练什么？</h1>
 <div class="sub">${t} ｜ 已完成 ${doneSetsN} 组</div>`;
 /* 升级建议卡 */
 const ups=upgradeReady();
 for(const u of ups){
  h+=`<div class="card sug"><b style="color:var(--acc2)">🎯 升级提示 · ${u.ex} ${EX[u.ex].n}</b>
  <div class="sub" style="margin:6px 0">你已连续2次做满 ${u.upper} 次 × ${EX[u.ex].sets} 组且不觉得难 → 今天可以试试升级：<br><b style="color:var(--txt)">${u.txt}</b></div>
  <div class="sub">先只试 1 组，感觉轻松再整组换；感觉吃力就退回，下次再说。</div>
  <div class="row" style="margin-top:8px"><button class="setbtn done" style="width:auto;padding:10px 14px" data-act="tryUpg" data-v="${u.ex}">今天先试一组</button><button class="setbtn" style="width:auto;padding:10px 14px" data-act="laterUpg" data-v="${u.ex}">过几天再说</button></div></div>`;
 }
 /* 复测提醒 */
 const mWarn=metricReminder();
 if(mWarn) h+=`<div class="card warn"><b style="color:var(--warn)">🧪 ${mWarn}</b><div class="sub" style="margin-top:4px">晨起空腹：量腰围 + 正/侧/背各拍一张照（同一面墙）+ 体测秤上称。数据在“统计→记录体测”填写。</div></div>`;
 h+=`<h2>力量训练（隔天交替）</h2>
 ${ri.rest?`<div class="card ${ri.done?'':'warn'}" style="margin-top:8px"><b style="color:${ri.done?'var(--acc)':'var(--warn)'}">${ri.msg}</b></div>`:''}
 <button class="btn" data-act="start" data-v="A">💪 训练A · 推+蹲日 ${sug==='A'?'<span class="chip on">建议今天</span>':''}<span class="r">6个动作·约40分</span></button>
 <button class="btn" data-act="start" data-v="B">🧲 训练B · 拉+髋日 ${sug==='B'?'<span class="chip on">建议今天</span>':''}<span class="r">6个动作·约40分</span></button>
 <div class="sub" style="margin-top:2px">第1周 A·B·A → 第2周 B·A·B 交替，两次训练至少隔1天。B7 弯举可选，在 B 日列表末尾。</div>
 <h2>每天必做</h2>
 <button class="btn" data-act="start" data-v="S">🧘 每日体态矫正 ${pd>=7?'<span class="chip on">今日已完成</span>':`<span class="r">${pd}/7 项</span>`}</button>
 <div class="row" style="margin-top:6px">

/* ============ 升级引擎与诊断 ============ */
function suggest(){
 const last=[...S.sessions].reverse().find(s=>s.t==='A'||s.t==='B');
 return last?(last.t==='A'?'B':'A'):'A';
}
function restInfo(){
 const t=today();
 const last=[...S.sessions].reverse().find(s=>s.t==='A'||s.t==='B');
 if(!last)return {rest:false,sug:suggest()};
 const diff=daysBetween(last.d,t);
 const nextName=last.t==='A'?'训练A':'训练B';
 if(diff===0)return {rest:true,done:true,msg:'今天已练完'+(last.t==='A'?'训练A':'训练B')+' ✅ 明天休息：只做体态矫正 + 吃与走，后天再练'+(last.t==='A'?'训练B':'训练A'),sug:''};
 if(diff===1)return {rest:true,done:false,msg:'昨天刚练过——今天建议休息：只做体态矫正 + 吃与走，明天再练'+(last.t==='A'?'训练B':'训练A'),sug:''};
 return {rest:false,sug:suggest()};
}
function doneSets(ex){const t=today();return S.logs.filter(l=>l.d===t&&l.ex===ex).length}
function sessionComplete(type){
 return WO[type].every(x=>doneSets(x)>=EX[x].sets);
}
function upgradeReady(){
 const t=today(), out=[];
 for(const ex in UPPER){
  if(!UPPER[ex])continue;
  if(!WO.A.includes(ex)&&!WO.B.includes(ex))continue;
  const type=ex[0];
  const sess=S.sessions.filter(s=>s.t===type&&s.d!==t).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,2);
  if(sess.length<2)continue;
  let ok=true;
  for(const s of sess){
   const ls=S.logs.filter(l=>l.d===s.d&&l.ex===ex);
   if(ls.length<EX[ex].sets){ok=false;break}
   if(ls.some(l=>(l.r||0)<UPPER[ex])){ok=false;break}
   if(s.rpe==='hard'){ok=false;break}
  }
  if(!ok)continue;
  const dis=S.upgDismiss[ex];
  if(dis&&daysBetween(dis,t)<3)continue;
  const txt=ex==='A1'&&((S.ladder.A1||1)<5)?`试试第 ${(S.ladder.A1||1)+1} 级：${LADDER[S.ladder.A1||1]}`:(UPGTXT[ex]||'');
  if(!txt)continue;
  out.push({ex,upper:UPPER[ex],txt});
 }
 return out;
}
function metricReminder(){
 if(!S.metrics.length)return '到时间做第一次体测记录了（已超过4周或从未记录）';
 const last=[...S.metrics].sort((a,b)=>b.d.localeCompare(a.d))[0].d;
 const diff=daysBetween(last,today());
 if(diff>=28)return `距离上次体测已 ${diff} 天，该做4周复测了`;
 return '';
}
function weekStart(){
 const now=new Date(); const day=(now.getDay()+6)%7;
 const mon=new Date(now); mon.setDate(now.getDate()-day); 
 return mon.getFullYear()+'-'+String(mon.getMonth()+1).padStart(2,'0')+'-'+String(mon.getDate()).padStart(2,'0');
}
function weekSessions(offset){
 const now=new Date(); const day=(now.getDay()+6)%7;
 const mon=new Date(now); mon.setDate(now.getDate()-day-offset*7); mon.setHours(0,0,0,0);
 const sun=new Date(mon); sun.setDate(mon.getDate()+7);
 let c=0;
 for(const s of S.sessions){const d=new Date(s.d+'T00:00:00'); if(d>=mon&&d<sun)c++;}
 return c;
}
function dateOffset(n){
 const d=new Date(); d.setDate(d.getDate()+n);
 return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ============ 交互逻辑 ============ */
function toggleSet(ex,i){
 const t=today();
 const idx=S.logs.findIndex(l=>l.d===t&&l.ex===ex&&l.s===i);
 const wasComplete=sessionComplete(ex[0]);
 if(idx>=0){S.logs.splice(idx,1);}
 else{
  S.logs.push({d:t,ex:ex,s:i,r:EX[ex].reps});
  if(sessionComplete(ex[0])&&!wasComplete){
   if(!S.sessions.find(s=>s.d===t&&s.t===ex[0])){
    S.sessions.push({d:t,t:ex[0]});
    rpeFor=ex[0];
    document.getElementById('rpeModal').style.display='flex';
    document.getElementById('rpeTitle').textContent=(ex[0]==='A'?'💪 训练A':'🧲 训练B')+'完成！这次感觉如何？';
   }
  }else{startTimer(EX[ex].rest,ex);}
 }
 save();render();
}
function posture(id){
 const key=today()+'|'+id;
 const i=S.posture.indexOf(key);
 if(i>=0)S.posture.splice(i,1);else{
  S.posture.push(key);
  if(POST.filter(p=>!p.opt).every(p=>S.posture.includes(today()+'|'+p.id)))toast('🧘 体态课全部完成！今日已打卡');
 }
 save();render();
}
/* 计时器 */
let iv=null,tEnd=0;
function startTimer(sec,ex){
 tEnd=Date.now()+sec*1000;
 document.getElementById('tname').textContent=(EX[ex]?EX[ex].n+' · ':'')+'组间休息 '+sec+'秒';
 document.getElementById('timerBar').style.display='block';
 clearInterval(iv);iv=setInterval(tick,250);tick();
}
function tick(){
 const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
 document.getElementById('tleft').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
 if(left<=0){clearInterval(iv);beep3();hideTimer();}
}
function hideTimer(){clearInterval(iv);document.getElementById('timerBar').style.display='none'}
function beep3(){
 try{const ctx=new (window.AudioContext||window.webkitAudioContext)();
 [0,250,500].forEach(off=>{
  const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);
  o.frequency.value=880;g.gain.setValueAtTime(.25,ctx.currentTime+off/1000);
  o.start(ctx.currentTime+off/1000);o.stop(ctx.currentTime+off/1000+.12);
 });}catch(e){}
}
function toast(msg){
 const el=document.getElementById('toast');
 el.textContent=msg;el.style.display='block';
 setTimeout(()=>el.style.display='none',2600);
}
function exportData(){
 const box=document.getElementById('expBox');
 box.value=JSON.stringify(S);
 try{box.focus();box.select();navigator.clipboard&&navigator.clipboard.writeText(box.value);}catch(e){}
 toast('数据已生成，全选复制 → 存到微信收藏');
}
function importData(){
 const box=document.getElementById('expBox');
 try{
  const d=JSON.parse(box.value);
  if(!d||!Array.isArray(d.logs))throw 0;
  S=d;save();render();toast('✅ 恢复成功');
 }catch(e){toast('导入失败：粘贴的内容不是有效备份')}
}
/* 事件委托 */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el)return;
 const act=el.dataset.act, v=el.dataset.v;
 if(act==='tab'){tab=v;session=null;render();
  document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
 }
 else if(act==='start'){session=v;openEx=null;render();}
 else if(act==='closeSession'){session=null;render();}
 else if(act==='openEx'){openEx=(openEx===v?null:v);render();}
 else if(act==='toggleSet'){const[a,b]=v.split(':');toggleSet(a,parseInt(b));}
 else if(act==='posture'){posture(v);}
 else if(act==='skipTimer'){hideTimer();}
 else if(act==='steps'){document.getElementById('stepInput').value=S.steps[today()]||'';document.getElementById('stepModal').style.display='flex';}
 else if(act==='saveSteps'){
  const t=today();const v=document.getElementById('stepInput').value;const n=parseInt(v,10);
  if(v===''||isNaN(n)){delete S.steps[t];const i=S.walk.indexOf(t);if(i>=0)S.walk.splice(i,1);}
  else{S.steps[t]=n;
   if(n>=8000){if(!S.walk.includes(t))S.walk.push(t);}else{const i=S.walk.indexOf(t);if(i>=0)S.walk.splice(i,1);}
   toast(n>=8000?'🚶 '+n+' 步，达标！':'🚶 今日 '+n+' 步，还差 '+(8000-n)+' 步');}
  save();document.getElementById('stepModal').style.display='none';render();
 }
 else if(act==='clearSteps'){const t=today();delete S.steps[t];const i=S.walk.indexOf(t);if(i>=0)S.walk.splice(i,1);save();document.getElementById('stepModal').style.display='none';render();}
 else if(act==='closeStepModal'){document.getElementById('stepModal').style.display='none';}
 else if(act==='warm'){
  const k=today()+'|'+session;const arr=S.warm[k]||[];const i=parseInt(v);
  const pos=arr.indexOf(i);
  if(pos>=0)arr.splice(pos,1);else arr.push(i);
  S.warm[k]=arr;
  if(arr.length>=5)toast('🔥 热身完成！接下来做正式动作');
  save();render();
 }
 else if(act==='repAdj'){const[ex,s,dir]=v.split(':');
  const t=today();const l=S.logs.find(x=>x.d===t&&x.ex===ex&&x.s===parseInt(s));
  if(l){l.r=Math.max(1,(l.r||0)+parseInt(dir));save();render();}}
 else if(act==='ladder'){S.ladder.A1=parseInt(v);save();render();}
 else if(act==='rpeLater'){rpeFor=null;document.getElementById('rpeModal').style.display='none';toast('好的，下次记得反馈');}
 else if(act==='rpe'){
  const t=today();
  const ss=[...S.sessions].reverse().find(s=>s.d===t&&s.t===rpeFor);
  if(ss)ss.rpe=v;
  save();rpeFor=null;document.getElementById('rpeModal').style.display='none';render();
 }
 else if(act==='tryUpg'){
  const ex=v, cur=S.ladder.A1||1;
  const txt=ex==='A1'&&cur<5?('第'+(cur+1)+'级：'+LADDER[cur]):(UPGTXT[ex]||'');
  toast('👍 今天先试一组：'+txt);S.upgDismiss[ex]=today();save();render();
 }
 else if(act==='laterUpg'){S.upgDismiss[v]=today();save();render();toast('好的，3天后再提醒你');}
 else if(act==='saveMetrics'){
  const g=id=>{const x=document.getElementById(id).value;return x===''?undefined:parseFloat(x)};
  const entry={d:today(),w:g('mW'),bf:g('mBf'),sm:g('mSm'),waist:g('mWa'),arm:g('mAr'),sh:g('mSh')};
  const hasAny=Object.keys(entry).some(k=>k!=='d'&&entry[k]!==undefined);
  if(!hasAny){toast('请至少填写一项再保存');}
  else{S.metrics.push(entry);save();render();toast('✅ 体测已保存，记得同姿势拍照存相册');}
 }
 else if(act==='exportData'){exportData();}
 else if(act==='importData'){importData();}
 else if(act==='resetAll'){if(confirm('确定清空全部打卡数据？此操作不可恢复（建议先导出备份）')){S={logs:[],posture:[],sessions:[],walk:[],steps:{},ladder:{},upgDismiss:{},metrics:[],warm:{}};save();render();toast('已清空');}}
});
render();
</script>
</body>
</html>
